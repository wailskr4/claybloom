
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Affichage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identité ClayBloom -->
    <title>ClayBloom — L'art de créer en argile</title>
    <meta
      name="description"
      content="Découvrez ClayBloom, votre espace créatif dédié au modelage en argile : tutoriels, techniques, inspirations et suivi de vos créations."
    />
    <meta name="application-name" content="ClayBloom" />
    <meta name="theme-color" content="#fff1f2" />

    <!-- Favicon : place le fichier favicon.svg dans le dossier public -->
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Icône de secours pour les navigateurs compatibles PNG -->
    <link rel="icon" type="image/png" href="/logo2.png" />

    <!-- Optimisation de l'affichage -->
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph : aperçu lors du partage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClayBloom" />
    <meta
      property="og:title"
      content="ClayBloom — L'art de créer en argile"
    />
    <meta
      property="og:description"
      content="Apprenez les techniques de modelage, suivez vos progrès et donnez vie à vos créations."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Nom et couleur du navigateur mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ClayBloom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
